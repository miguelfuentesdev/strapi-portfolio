name: Build & Push Strapi image (GHCR + ECR)

on:
  push:
    branches: ["master"]
    paths:
      - "apps/cms/**"
      - ".github/workflows/cms-image-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC para asumir el rol de AWS sin llaves

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::020139097054:role/github-actions-strapi-portfolio
  ECR_IMAGE: 020139097054.dkr.ecr.us-west-2.amazonaws.com/portfolio-cms

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
      # GHCR requiere el path en lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-cms" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/cms
          file: ./apps/cms/Dockerfile.prod
          platforms: linux/amd64
          push: true
          # Lambda no acepta manifest lists: sin attestations
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.ECR_IMAGE }}:latest
            ${{ env.ECR_IMAGE }}:${{ github.sha }}
