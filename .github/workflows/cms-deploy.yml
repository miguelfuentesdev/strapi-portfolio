name: Build & Deploy Strapi to Lambda

on:
  push:
    branches: ["master"]
    paths:
      - "apps/cms/**"
      - ".github/workflows/cms-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC para asumir el rol de AWS sin llaves

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::020139097054:role/github-actions-strapi-portfolio
  ECR_IMAGE: 020139097054.dkr.ecr.us-west-2.amazonaws.com/portfolio-cms

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Pulls anónimos a public.ecr.aws (Lambda Web Adapter) chocan con el límite compartido de los runners
      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_REGION: us-east-1 # ECR Public solo existe en us-east-1
        with:
          registry-type: public

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/cms
          file: ./apps/cms/Dockerfile.prod
          platforms: linux/amd64
          push: true
          # Lambda no acepta manifest lists: sin attestations
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.ECR_IMAGE }}:latest
            ${{ env.ECR_IMAGE }}:${{ github.sha }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name strapi-portfolio \
            --image-uri "${{ env.ECR_IMAGE }}:${{ github.sha }}" \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name strapi-portfolio
